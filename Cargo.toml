[workspace]
resolver = "2"
members = [
    "crates/gpui-agent",
    "crates/gpui-agent-cli",
    "crates/gpui-agent-recipe",
    "crates/gpui-agent-bench",
    "crates/gpui-agent-policy",
    "crates/todo-core",
    "apps/todo",
    "apps/todo-headless",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/hexuria/gpui-agent"
homepage = "https://github.com/hexuria/gpui-agent"

[workspace.dependencies]
gpui-agent = { path = "crates/gpui-agent", version = "0.1.0" }
gpui-agent-recipe = { path = "crates/gpui-agent-recipe", version = "0.1.0" }
gpui-agent-policy = { path = "crates/gpui-agent-policy", version = "0.1.0" }
todo-core = { path = "crates/todo-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
gpui-kit = "0.6"

# TEMPORARY (M0 blocked: human-publish): resolve the instinct crates from
# the publishable-crates PR head until `cargo add instinct-core@0.1` works.
# Remove this table — do not merge anything that needs it — before M2 lands.
[patch.crates-io]
instinct-core = { git = "https://github.com/hexuria/instinct", rev = "75ad24e" }
instinct-lexicon = { git = "https://github.com/hexuria/instinct", rev = "75ad24e" }
instinct-text = { git = "https://github.com/hexuria/instinct", rev = "75ad24e" }
