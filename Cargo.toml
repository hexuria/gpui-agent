[workspace]
resolver = "2"
members = [
    "crates/gpui-agent",
    "crates/gpui-agent-cli",
    "crates/todo-core",
    "apps/todo",
    "apps/todo-headless",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/hexuria/gpui-agent"
homepage = "https://github.com/hexuria/gpui-agent"

[workspace.dependencies]
gpui-agent = { path = "crates/gpui-agent" }
todo-core = { path = "crates/todo-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
gpui-kit = "0.6"
