[package]
name = "todo"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "GPUI Kit 0.6 todo desktop client of the headless daemon (ADR-001)."

[features]
default = []
# In-process AgentHost + mailbox for widget E2E. Product mutations go through
# the daemon; this flag must not become a second store for agent-machine writes.
embedded-host = []

[dependencies]
gpui-kit.workspace = true
todo-core.workspace = true
gpui-agent.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
raw-window-handle = "0.6"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
