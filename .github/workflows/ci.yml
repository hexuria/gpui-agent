# P4: headless recipe receipt is the visual-free CI gate.
# Do not add macOS / GPU / screenshot jobs here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  headless:
    name: test + recipe receipt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: cargo audit
        run: cargo audit
      - name: Unit tests (no GPU)
        run: cargo test -p gpui-agent -p todo-core -p gpui-agent-cli -p gpui-agent-recipe
      - name: Unit tests (instinct feature)
        run: |
          cargo test -p gpui-agent-cli --features instinct
          cargo test -p gpui-agent-recipe --features instinct
      - name: Unit tests + compile (jev feature)
        run: |
          cargo test -p gpui-agent-cli --features jev
          cargo clippy -p gpui-agent-cli --features jev --all-targets -- -D warnings
      - name: Headless recipe receipt (ok + session_reused)
        env:
          GPUI_AGENT: "1"
          GPUI_AGENT_ADDR: "127.0.0.1:17421"
          GPUI_AGENT_TOKEN: "ci-p4-token"
        run: ./scripts/ci-recipe.sh

  packages:
    name: cli + daemon artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Release CLI + daemon (no GPUI)
        run: cargo build --release -p gpui-agent-cli -p todo-headless
      - name: Daemon must not depend on gpui-kit
        run: |
          if cargo tree -p todo-headless -i gpui-kit >/tmp/gpui-kit-why.txt 2>&1; then
            echo "todo-headless must not depend on gpui-kit" >&2
            cat /tmp/gpui-kit-why.txt >&2
            exit 1
          fi
      - name: Upload linux-x64 binaries
        uses: actions/upload-artifact@v4
        with:
          name: gpui-agent-linux-x64
          path: |
            target/release/gpui-agent
            target/release/todo-headless

  windows:
    name: cli + agent (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Release CLI
        run: cargo build --release -p gpui-agent-cli
      - name: Agent tests
        run: cargo test -p gpui-agent

  deps-guard:
    name: no forbidden deps in gpui-agent (I3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: gpui-agent must not pull instinct / typesafe / async-HTTP
        run: |
          tree=$(cargo tree -p gpui-agent -e normal)
          for banned in instinct typesafe tokio reqwest ureq hyper; do
            if echo "$tree" | grep -qi "$banned"; then
              echo "forbidden dependency '$banned' reached gpui-agent (I3):" >&2
              echo "$tree" | grep -i "$banned" >&2
              exit 1
            fi
          done
          echo "deps-guard: clean"

  bench-local:
    name: R0/R1 + A2 bench (no network)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Build bench + headless host
        run: cargo build -p gpui-agent-bench -p todo-headless
      - name: R0 intent corpus (20 attempts/row)
        run: |
          mkdir -p bench/results/ci
          cargo run -q -p gpui-agent-bench -- \
            resolve --corpus bench/intents.toml --arm r0 \
            --attempts 20 --out bench/results/ci/r0.jsonl
      - name: R1 intent corpus (instinct resolver)
        run: |
          cargo run -q -p gpui-agent-bench --features instinct -- \
            resolve --corpus bench/intents.toml --arm r1 \
            --attempts 20 --out bench/results/ci/r1.jsonl
      - name: A2 local-policy tasks (3 attempts/task)
        run: |
          cargo build -q -p gpui-agent-cli --features instinct
          export PATH="$PWD/target/debug:$PATH"
          cargo run -q -p gpui-agent-bench -- \
            local --tasks bench/tasks.toml --arm a2 \
            --goal-cmd 'gpui-agent run --goal "$GPUI_AGENT_BENCH_GOAL"' \
            --attempts 3 --out bench/results/ci/a2.jsonl
      - name: Upload bench JSONL
        uses: actions/upload-artifact@v4
        with:
          name: bench-local
          path: bench/results/ci/
