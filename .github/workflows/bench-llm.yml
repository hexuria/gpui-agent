# LLM benchmark arms (A0/A1/A3) — manual only, never on PR.
# Requires the ANTHROPIC_API_KEY repository secret.
name: bench-llm

on:
  workflow_dispatch:
    inputs:
      arm:
        description: "arm to run (a0, a1)"
        required: true
        default: "a1"
      only:
        description: "comma-separated task ids (blank = all 16)"
        required: false
      attempts:
        description: "attempts per task"
        required: true
        default: "5"

permissions:
  contents: read

jobs:
  llm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - name: Build CLI + headless host
        run: cargo build --release -p gpui-agent-cli -p todo-headless
      - name: Run arm ${{ inputs.arm }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p bench/results/manual
          cd bench
          uv run --locked python run.py \
            --arm "${{ inputs.arm }}" \
            --binary ../target/release/gpui-agent \
            --host-binary ../target/release/todo-headless \
            --attempts "${{ inputs.attempts }}" \
            ${ONLY:+--only "${{ inputs.only }}"} \
            --out "results/manual/${{ inputs.arm }}.jsonl"
        env:
          ONLY: ${{ inputs.only }}
      - name: Upload JSONL
        uses: actions/upload-artifact@v4
        with:
          name: bench-llm-${{ inputs.arm }}
          path: bench/results/manual/
