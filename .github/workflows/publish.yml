# Tags vMAJOR.MINOR.PATCH publish the public crates, in dependency order,
# then attach prebuilt `gpui-agent` binaries for `cargo binstall`.
# Skipped: apps/todo, apps/todo-headless, crates/todo-core (publish = false).
# The registry token is the Actions secret CARGO_REGISTRY_TOKEN. Do not echo it.
name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0

      - name: Require vMAJOR.MINOR.PATCH matching the workspace version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must be vMAJOR.MINOR.PATCH: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          tag_ver="${GITHUB_REF_NAME#v}"
          cargo_ver="$(awk '
            /^\[workspace\.package\]$/ { in_ws=1; next }
            in_ws && /^\[/ { exit }
            in_ws && /^version[[:space:]]*=/ {
              gsub(/"/, "", $3); print $3; exit
            }
          ' Cargo.toml)"
          if [ -z "${cargo_ver}" ] || [ "${tag_ver}" != "${cargo_ver}" ]; then
            echo "tag ${tag_ver} does not match Cargo workspace version ${cargo_ver}" >&2
            exit 1
          fi

      - name: Publish crates in dependency order
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # Retry only when crates.io has not indexed the previous crate yet.
          for pkg in gpui-agent gpui-agent-recipe gpui-agent-cli; do
            echo "publishing ${pkg}"
            ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              log="$(mktemp)"
              set +e
              cargo publish -p "${pkg}" >"${log}" 2>&1
              code=$?
              set -e
              cat "${log}"
              if [ "${code}" -eq 0 ]; then
                rm -f "${log}"
                ok=1
                break
              fi
              if grep -Eq 'already uploaded|already exists' "${log}"; then
                echo "${pkg} is already on crates.io; continuing"
                rm -f "${log}"
                ok=1
                break
              fi
              if grep -Eq 'no matching package|failed to select a version' "${log}"; then
                echo "crates.io index does not see ${pkg} dependencies yet (attempt ${attempt}); waiting"
                rm -f "${log}"
                sleep 20
                continue
              fi
              rm -f "${log}"
              exit 1
            done
            if [ "${ok}" -ne 1 ]; then
              echo "giving up on ${pkg}" >&2
              exit 1
            fi
          done

  binaries:
    name: binstall ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}

      - name: Install Linux aarch64 linker
        if: matrix.linker == 'aarch64-linux-gnu-gcc'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build gpui-agent
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --release --target ${{ matrix.target }} -p gpui-agent-cli

      - name: Pack tarball and checksum
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          target="${{ matrix.target }}"
          name="gpui-agent-cli-${target}-v${ver}.tgz"
          stage="$(mktemp -d)"
          mkdir -p "${stage}/gpui-agent-cli"
          cp "target/${target}/release/gpui-agent" "${stage}/gpui-agent-cli/gpui-agent"
          chmod +x "${stage}/gpui-agent-cli/gpui-agent"
          tar -C "${stage}" -czf "${name}" gpui-agent-cli
          python3 - "${name}" <<'PY'
          import hashlib, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          pathlib.Path(path.name + ".sha256").write_text(f"{digest}  {path.name}\n")
          print(digest, path.name)
          PY
          mkdir -p dist
          mv "${name}" "${name}.sha256" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: binstall-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: attach binstall assets
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binstall-*
          merge-multiple: true
          path: dist

      - name: Combined checksum file
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib
          lines = []
          for path in sorted(pathlib.Path('.').glob('*.tgz')):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {path.name}")
          pathlib.Path('SHA256SUMS').write_text('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
