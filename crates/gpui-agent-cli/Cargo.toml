[package]
name = "gpui-agent-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CLI and tiny MCP stdio shim for the GPUI agent protocol."

[[bin]]
name = "gpui-agent"
path = "src/main.rs"

[dependencies]
gpui-agent.workspace = true
gpui-agent-recipe.workspace = true
gpui-agent-policy = { workspace = true, optional = true }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
# Opt-in Instinct policy: `locate`/`act` MCP tools + Instinct recipe
# resolver. Off by default — feature-free builds keep the legacy tool
# set and resolver byte-identical.
instinct = ["dep:gpui-agent-policy", "gpui-agent-recipe/instinct"]

[dev-dependencies]
todo-core.workspace = true

# cargo-binstall: v* GitHub Release asset
# gpui-agent-cli-<target>-v<version>.tgz contains gpui-agent-cli/gpui-agent
# plus a sibling .sha256 file.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }{ archive-suffix }"
bin-dir = "{ name }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
